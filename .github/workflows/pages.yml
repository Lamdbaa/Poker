name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          git ls-files | grep -vE '^(\.github/|README\.md$|LISEZ-MOI\.md$)' | while IFS= read -r f; do
            mkdir -p "site/$(dirname "$f")"
            cp "$f" "site/$f"
          done
          sed -i "s/^const CACHE = .*/const CACHE = \"jetons-${GITHUB_SHA::8}\";/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
